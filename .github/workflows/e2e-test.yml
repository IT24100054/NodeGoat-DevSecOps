name: E2E Test

on: [push, pull_request]

jobs:
  e2e-test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        node-version: ["10.x", "12.x", "14.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm run cy:verify

      - name: Start MongoDB
        run: |
          docker run -d \
            --name nodegoat-mongo \
            -p 27017:27017 \
            mongo:4.4

          echo "Waiting for MongoDB..."

          for i in {1..30}; do
            if docker exec nodegoat-mongo \
              mongo --quiet --eval "db.adminCommand('ping').ok" 2>/dev/null | grep -q 1; then
              echo "MongoDB is ready"
              break
            fi

            echo "MongoDB not ready yet..."
            sleep 2
          done

          echo "MongoDB container status:"
          docker ps

          echo "MongoDB logs:"
          docker logs nodegoat-mongo

      - name: Run E2E test suite
        id: test-suite
        run: |
          NODE_ENV=test npm start -- --silent &
          sleep 5
          npm run test:ci -- --config video=true

      - name: Prepare cypress artifacts
        if: failure() && (steps.test-suite.outcome == 'failure')
        working-directory: ./test/e2e
        run: >
          mkdir -p "screenshots" &&
          find "screenshots" -mindepth 1 -maxdepth 1 -type d
          -exec sh -c 'mv -- "videos/$(basename "$1").mp4" "$1"' _ {} \;

      - name: Upload cypress artifacts
        if: failure() && (steps.test-suite.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts-node${{ matrix.node-version }}
          path: test/e2e/screenshots